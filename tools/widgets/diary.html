<style>
body{margin:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));font:15px/1.4 system-ui,sans-serif}
.l{font:600 11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--tg-theme-hint-color);margin:0 0 8px}
.cal{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px;font:11px ui-monospace,monospace;color:var(--tg-theme-hint-color);text-align:center;align-items:center}
.c{height:26px;border-radius:7px;border:0;padding:0;font:11px ui-monospace,monospace;color:#1A1A2E;background:none}
.c.x{color:var(--tg-theme-hint-color);border:1px solid var(--tg-theme-section-separator-color)}
.c.o{box-shadow:0 0 0 2px var(--tg-theme-text-color)}
.c.f{background:none!important;color:var(--tg-theme-hint-color);border:1px dashed var(--tg-theme-section-separator-color)}
.c.p{animation:p .6s infinite alternate}@keyframes p{to{transform:scale(.85)}}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ch button{min-height:34px;padding:4px 10px;border-radius:17px;border:1px solid var(--tg-theme-section-separator-color);background:none;color:var(--tg-theme-text-color);font:13px system-ui,sans-serif}
.ch button.on{background:var(--tg-theme-secondary-bg-color);border-color:var(--tg-theme-text-color);font-weight:600}
.ch i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ch span{font-family:ui-monospace,monospace;color:var(--tg-theme-hint-color)}
.qt{margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--tg-theme-secondary-bg-color);font-size:14px;user-select:text;-webkit-user-select:text}
.qt b{display:block;font:600 11px ui-monospace,monospace;color:var(--tg-theme-hint-color);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.c.p{animation:none}}
</style>
<div class="l" id="h"></div>
<div class="cal" id="g"></div>
<div id="q"></div>
<div class="ch" id="t"></div>
<div class="l">Чаще вместе · нажмите, чтобы найти дни</div>
<div class="ch" id="p"></div>
<script>
var W=window.TelegramWidget,E={'работа':'💼','тревога':'🌀','сон':'🌙','отношения':'💞','спорт':'🏃','деньги':'💰'},

M=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],D,flt=null,sel=null,busy=null,txt={};

function pl(n,a,b,c){var m=n%10,h=n%100;return m==1&&h!=11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function col(m){for(var i=0;i<D.t.length;i++)if(m>>i&1)return C[D.t[i]]||'#B0A8C0';return '#C9CED6'}
function r(){try{D=JSON.parse(W.chatData)||{}}catch(x){D={}}if(!D.a)return;
var by={},cnt=[];D.e.forEach(function(e){by[e[0]]=e[1];D.t.forEach(function(t,i){if(e[1]>>i&1)cnt[i]=(cnt[i]||0)+1})});
document.getElementById('h').textContent='Дневник · '+D.e.length+' '+pl(D.e.length,'запись','записи','записей');
var g=document.getElementById('g');g.innerHTML='';g.appendChild(el('span'));['пн','вт','ср','чт','пт','сб','вс'].forEach(function(w){g.appendChild(el('span','',w))});
var s=(day(0).getDay()+6)%7,last=-1;for(var k=-s;k<D.n;k++){var dd=day(k);if((k+s)%7==0){var mo=dd.getMonth();g.appendChild(el('span','',mo!=last?M[mo]:''));last=mo}
if(k<0){g.appendChild(el('span'));continue}
var m=by[k],b=el('button','c',dd.getDate());if(m==null)b.className+=' x';else{if(flt!=null&&(m&flt)!=flt)b.className+=' f';b.style.background=col(m);(function(i){b.onclick=function(){open(i)}})(k)}
if(sel==k)b.className+=' o';if(busy==k)b.className+=' p';g.appendChild(b)}
var t=document.getElementById('t');t.innerHTML='';D.t.forEach(function(n,i){var b=el('button',flt==1<<i?'on':'');var c=el('i');c.style.background=C[n]||'#B0A8C0';b.appendChild(c);b.appendChild(document.createTextNode((E[n]||'')+' '+n+' '+(cnt[i]||0)));b.onclick=function(){flt=flt==1<<i?null:1<<i;r()};t.appendChild(b)});

function by2(i){for(var k=0;k<D.e.length;k++)if(D.e[k][0]==i)return D.e[k][1];return 0}
function open(i){if(sel==i&&busy==null){sel=null;return r()}sel=i;if(txt[i])return r();busy=i;r();
W.request('e:'+(D.m?D.m+':':'')+i).then(function(a){txt[i]=a.result||'Записи за этот день нет.';busy=null;r()},function(){txt[i]='Не удалось открыть запись.';busy=null;r();delete txt[i]})}
W.onEvent('chatDataChanged',r);r();W.ready&&W.ready();
</script>
